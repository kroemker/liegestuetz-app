name: CI

on:
  push:
    branches: [ "main", "claude/**", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # Install Gradle 8.10 explicitly so we can generate the wrapper binary.
      # The wrapper properties file is committed but the gradlew script and
      # gradle-wrapper.jar are not (they are binary/generated). This step
      # installs the Gradle CLI and the next step writes the wrapper files.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10
        working-directory: ${{ github.workspace }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Inject google-services.json from repository secret when available,
      # otherwise fall back to the committed placeholder (which lets the
      # build succeed but Firebase will not work at runtime).
      - name: Inject google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
            echo "✅ Injected real google-services.json from secret"
          else
            echo "⚠️  No GOOGLE_SERVICES_JSON secret found — using committed placeholder"
            echo "   Firebase will not work at runtime but the build will succeed."
          fi

      - name: Lint
        run: ./gradlew lint --continue

      - name: Unit tests
        run: ./gradlew test --continue

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: "**/build/reports/lint-results*.html"
          retention-days: 7
