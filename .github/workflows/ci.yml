name: CI

on:
  push:
    branches: [ "main", "claude/**", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # Inject the placeholder google-services.json so the build doesn't fail.
      # In a real CI pipeline, store the real file as a repository secret:
      #   Settings > Secrets > Actions > GOOGLE_SERVICES_JSON
      # Then replace this step with:
      #   echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
      - name: Verify google-services.json exists
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "ERROR: app/google-services.json is missing."
            echo "Add the file locally or store it as a GitHub secret."
            exit 1
          fi

      - name: Lint
        run: ./gradlew lint --continue

      - name: Unit tests
        run: ./gradlew test --continue

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: "**/build/reports/lint-results*.html"
          retention-days: 7
